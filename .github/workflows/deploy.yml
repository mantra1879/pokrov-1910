name: Deploy Pokrov 1910 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Extract static site package
        run: unzip -q Pokrov-1910-GitHub-Pages-Ready.zip -d _bundle
      - name: Apply photographed facade repair
        run: |
          base64 --decode Pokrov-1910-model-fix-2026-11-05.zip.b64 > /tmp/pokrov-model-fix.zip
          unzip -oq /tmp/pokrov-model-fix.zip -d _bundle/Pokrov-1910-Public-Site
      - name: Align house 80 roof to its facade
        run: python3 apply-house80-roof-fix.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _bundle/Pokrov-1910-Public-Site/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
